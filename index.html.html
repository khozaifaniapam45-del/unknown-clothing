<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>unknown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3E3E0;--ink:#151515;--mute:#5d5d59;--line:#151515;--acc:#2f3cff;--card:#d4d4d0;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#e8e8e4;--mute:#9a9a95;--line:#e8e8e4;--acc:#7d87ff;--card:#1f1f1f;--onacc:#101010}}
:root[data-theme="dark"]{--bg:#121212;--ink:#e8e8e4;--mute:#9a9a95;--line:#e8e8e4;--acc:#7d87ff;--card:#1f1f1f;--onacc:#101010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:2px solid var(--line);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap}
.logo{font-stretch:62%;font-weight:900;font-size:26px;letter-spacing:-.02em;text-decoration:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-current="page"]{border-bottom-color:var(--acc)}
nav button:hover{background:var(--card)}
main{max-width:1100px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{margin:0;line-height:.95;letter-spacing:-.03em;font-weight:900;font-stretch:70%}
.hero{padding:56px 0 40px}
.hero h1{font-size:clamp(72px,19vw,220px);display:flex;align-items:center;gap:.04em;flex-wrap:wrap}
.bar{display:inline-block;background:var(--ink);height:.62em;width:1.6em;border-radius:2px;margin-left:.05em}
.hero p{max-width:46ch;font-size:19px;margin:24px 0}
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);font:inherit;font-weight:700;padding:13px 24px;cursor:pointer;border-radius:0}
.btn:hover{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.alt{background:none;color:var(--ink)}
.btn.alt:hover{background:var(--card);color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:24px}
.prod{display:flex;flex-direction:column}
.swatch{aspect-ratio:4/5;display:flex;align-items:flex-end;padding:14px;font-stretch:62%;font-weight:900;font-size:44px;letter-spacing:-.03em;line-height:.9;overflow:hidden}
.prod .meta{display:flex;justify-content:space-between;padding:10px 0 8px;font-weight:600}
h2{font-size:clamp(36px,7vw,64px);margin-top:48px}
.sub{color:var(--mute);margin:10px 0 0;max-width:56ch}
.about p{max-width:62ch;font-size:18px}
.about .rule{border-top:2px solid var(--line);padding-top:18px;margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.panel{background:var(--card);padding:24px;margin-top:24px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input,select{width:100%;font:inherit;padding:12px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#c4231c;font-weight:600;margin-top:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8d86}}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--mute)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:16px 0}
.pay{display:flex;gap:8px;margin-top:6px}
.pay button{flex:1;padding:11px;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pay button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{list-style:none;padding:0;margin:24px 0 0;border-left:3px solid var(--mute)}
.steps li{padding:0 0 22px 22px;position:relative;color:var(--mute)}
.steps li::before{content:"";position:absolute;left:-10px;top:4px;width:17px;height:17px;background:var(--bg);border:3px solid var(--mute)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--ink);border-color:var(--ink)}
.steps li.now{font-weight:800;color:var(--ink)}
.steps li.now::before{background:var(--acc);border-color:var(--acc)}
.steps small{display:block;font-weight:400;color:var(--mute)}
.badge{display:inline-block;background:var(--acc);color:var(--onacc);font-weight:700;font-size:13px;padding:2px 8px;margin-left:6px}
footer{border-top:2px solid var(--line);padding:24px 20px;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar{animation:b 1.2s .3s both cubic-bezier(.7,0,.2,1)}@keyframes b{from{width:0}}}
</style>
</head>
<body>
<header>
  <button class="logo" data-go="home" aria-label="unknown home">unknown</button>
  <nav aria-label="Main">
    <button data-go="home">Home</button>
    <button data-go="shop">Shop</button>
    <button data-go="about">About</button>
    <button data-go="track">Track order</button>
    <button data-go="cart">Cart<span class="badge" id="cnt">0</span></button>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<footer>© unknown. Prices in <span class="cur"></span>. Demo checkout: no real payment is taken.</footer>

<script>
const CUR="$";
const PRODUCTS=[
 {id:1,name:"Blank Hoodie",price:68,bg:"#151515",fg:"#e3e3e0"},
 {id:2,name:"Redact Tee",price:32,bg:"#2f3cff",fg:"#ffffff"},
 {id:3,name:"Cargo Pant",price:74,bg:"#8a8a82",fg:"#151515"},
 {id:4,name:"Void Crewneck",price:58,bg:"#c9c9c4",fg:"#151515"},
 {id:5,name:"Anon Cap",price:24,bg:"#151515",fg:"#7d87ff"},
 {id:6,name:"Shell Jacket",price:110,bg:"#5a5a55",fg:"#ffffff"}
];
const STAGES=["Order placed","Packed","Shipped","Out for delivery","Delivered"];
const $=s=>document.querySelector(s), money=n=>CUR+n.toFixed(2);
let cart=[], orders={}, page="home", payMethod="card", msg="";

// storage (per-viewer convenience only)
function load(){try{orders=JSON.parse(localStorage.getItem("unk_orders")||"{}")}catch(e){orders={}}}
function save(){try{localStorage.setItem("unk_orders",JSON.stringify(orders))}catch(e){}}
load();
// demo order so tracking can be tried right away
if(!orders["UNK-1001"])orders["UNK-1001"]={id:"UNK-1001",email:"demo@unknown.com",total:100,items:["Redact Tee ×1","Blank Hoodie ×1"],t:Date.now()-3*60000,demo:true,stage:2};

function stageOf(o){return o.demo?o.stage:Math.min(4,Math.floor((Date.now()-o.t)/20000))} // demo: advances every 20s

function go(p){page=p;msg="";render();window.scrollTo(0,0);$("#app").focus({preventScroll:true})}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.dataset.go===page?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("#cnt").textContent=cart.reduce((a,c)=>a+c.q,0);
  document.querySelectorAll(".cur").forEach(e=>e.textContent=CUR);
  $("#app").innerHTML=({home,shop,about,track,cart:cartView,done})[page]();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(+b.dataset.add));
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qty(+b.dataset.id,+b.dataset.q));
  const f=$("#trackBtn");if(f)f.onclick=lookup;
  const p=$("#payBtn");if(p)p.onclick=pay;
  document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{payMethod=b.dataset.pm;keep(()=>render())});
}
function keep(fn){const v={};document.querySelectorAll("#app input").forEach(i=>v[i.id]=i.value);fn();Object.entries(v).forEach(([k,x])=>{const i=document.getElementById(k);if(i)i.value=x})}
function add(id){const c=cart.find(x=>x.id===id);c?c.q++:cart.push({id,q:1});$("#cnt").textContent=cart.reduce((a,c)=>a+c.q,0);const b=document.querySelector(`[data-add="${id}"]`);if(b){b.textContent="Added";setTimeout(()=>b.textContent="Add to cart",900)}}
function qty(id,d){const c=cart.find(x=>x.id===id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!==id);render()}
const prod=p=>`<div class="prod"><div class="swatch" style="background:${p.bg};color:${p.fg}">${p.name}</div><div class="meta"><span>${p.name}</span><span>${money(p.price)}</span></div><button class="btn sm" data-add="${p.id}">Add to cart</button></div>`;

function home(){return `<section class="hero"><h1>unkn<span class="bar" aria-hidden="true"></span>wn</h1>
<p>Clothing with the label taken off. Heavy cotton, plain cuts, no logos shouting at you.</p>
<button class="btn" data-go="shop">Shop the drop</button> <button class="btn alt" data-go="track">Track an order</button></section>
<h2>New in</h2><div class="grid">${PRODUCTS.slice(0,3).map(prod).join("")}</div>`}

function shop(){return `<h2>Shop</h2><p class="sub">Every piece ships in plain packaging.</p><div class="grid">${PRODUCTS.map(prod).join("")}</div>`}

function about(){return `<section class="about"><h2>About unknown</h2>
<p style="margin-top:28px">unknown started with a simple question: what if you couldn't tell who made it? No loud branding, no seasonal noise. Just clothes you can wear for years and make your own.</p>
<p>We make small batches in heavyweight fabrics and keep the designs plain on purpose. If you want to know who we are, look at how the clothes fit and how they last.</p>
<div class="rule"><div><h3>Small batches</h3><p class="sub">Limited runs so nothing sits in a warehouse.</p></div><div><h3>Built to last</h3><p class="sub">Heavy cotton, reinforced seams.</p></div><div><h3>Straight answers</h3><p class="sub">Track every order from packing to your door.</p></div></div></section>`}

function track(){return `<h2>Track your order</h2><p class="sub">Enter the order number from your confirmation. Try UNK-1001 to see how it works.</p>
<div class="panel"><label for="oid">Order number</label><input id="oid" placeholder="UNK-1001" autocomplete="off">
<div style="margin-top:16px"><button class="btn" id="trackBtn">Track order</button></div><div class="err" id="terr" role="alert"></div></div><div id="tres"></div>`}
function lookup(){
  const id=$("#oid").value.trim().toUpperCase(), o=orders[id];
  if(!o){$("#terr").textContent="We can't find that order number. Check it and try again.";$("#tres").innerHTML="";return}
  $("#terr").textContent="";
  const s=stageOf(o);
  $("#tres").innerHTML=`<div class="panel"><h3 style="font-size:32px">${o.id}</h3><p class="sub">${o.items.join(", ")} · ${money(o.total)}</p>
  <ol class="steps">${STAGES.map((n,i)=>`<li class="${i<s?"done":i===s?"now":""}">${n}${i<=s?`<small>${i===s&&s<4?"Current status":"Complete"}</small>`:""}</li>`).join("")}</ol></div>`;
}

function cartView(){
  if(!cart.length)return `<h2>Your cart</h2><p class="sub">Nothing here yet.</p><p><button class="btn" data-go="shop">Browse the shop</button></p>`;
  const total=cart.reduce((a,c)=>a+PRODUCTS.find(p=>p.id===c.id).price*c.q,0);
  return `<h2>Checkout</h2><div class="panel">${cart.map(c=>{const p=PRODUCTS.find(x=>x.id===c.id);return `<div class="line"><span>${p.name}<br><small>${money(p.price)}</small></span><span class="qty"><button data-id="${p.id}" data-q="-1" aria-label="Remove one">−</button>${c.q}<button data-id="${p.id}" data-q="1" aria-label="Add one">+</button></span></div>`}).join("")}
  <div class="total"><span>Total</span><span>${money(total)}</span></div></div>
  <div class="panel"><h3 style="font-size:28px">Delivery</h3>
  <label for="nm">Full name</label><input id="nm" autocomplete="name">
  <div class="row"><div><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div><div><label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel"></div></div>
  <label for="ad">Delivery address</label><input id="ad" autocomplete="street-address">
  <h3 style="font-size:28px;margin-top:28px">Payment</h3>
  <div class="pay" role="group" aria-label="Payment method"><button data-pm="card" aria-pressed="${payMethod==="card"}">Card</button><button data-pm="momo" aria-pressed="${payMethod==="momo"}">Mobile money</button></div>
  ${payMethod==="card"?`<label for="cn">Card number</label><input id="cn" inputmode="numeric" placeholder="1234 5678 9012 3456" autocomplete="cc-number"><div class="row"><div><label for="ex">Expiry</label><input id="ex" placeholder="MM/YY" autocomplete="cc-exp"></div><div><label for="cv">CVV</label><input id="cv" inputmode="numeric" autocomplete="cc-csc"></div></div>`
  :`<label for="mn">Mobile money number</label><input id="mn" inputmode="tel" placeholder="Number to charge"><p class="sub">You'll get a prompt on your phone to approve the payment.</p>`}
  <div class="err" id="perr" role="alert">${msg}</div>
  <div style="margin-top:18px"><button class="btn" id="payBtn">Pay ${money(total)}</button></div></div>`;
}
let last=null;
function pay(){
  const v=id=>($("#"+id)?.value||"").trim();
  const need=payMethod==="card"?["nm","em","ad","cn","ex","cv"]:["nm","em","ad","mn"];
  if(need.some(i=>!v(i))){$("#perr").textContent="Fill in every field before paying.";return}
  if(!/^\S+@\S+\.\S+$/.test(v("em"))){$("#perr").textContent="Enter a valid email address.";return}
  const total=cart.reduce((a,c)=>a+PRODUCTS.find(p=>p.id===c.id).price*c.q,0);
  const id="UNK-"+(1002+Object.keys(orders).length+Math.floor(Math.random()*90));
  last=orders[id]={id,email:v("em"),total,t:Date.now(),items:cart.map(c=>PRODUCTS.find(p=>p.id===c.id).name+" ×"+c.q)};
  save();cart=[];go("done");
}
function done(){return `<section class="hero"><h2 style="margin-top:0">Payment received</h2><p>Thanks${last?". Your order number is ":"."}<strong>${last?last.id:""}</strong>. Keep it to track your delivery.</p>
<button class="btn" data-go="track">Track order</button> <button class="btn alt" data-go="shop">Keep shopping</button></section>`}

render();
</script>
</body>
</html>
